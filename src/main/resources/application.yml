spring:
  datasource:
    # When running in Docker: value comes from env SPRING_DATASOURCE_URL
    # When running from IDE: default is localhost:1521/FREEPDB1
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:NVB_DOCS_OWNER}
    password: ${SPRING_DATASOURCE_PASSWORD:docs_owner_pass}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 30000
      connection-timeout: 30000
      pool-name: OracleHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: NVB_DOCS_OWNER

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
